name: Build and Test RaceDay
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  api-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Part2-API
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --verbosity normal
  mvc-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Part3-MVC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
