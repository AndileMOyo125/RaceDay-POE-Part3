services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:-RaceDay!LocalDev2026}"
    ports:
      - "1433:1433"
    volumes:
      - raceday-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '$${MSSQL_SA_PASSWORD}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s
  api:
    build:
      context: ./Part2-API
      dockerfile: RaceDay.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__RaceDayDb: "Server=sqlserver,1433;Database=RaceDayApiDB;User Id=sa;Password=${SQL_SA_PASSWORD:-RaceDay!LocalDev2026};TrustServerCertificate=True;Encrypt=False"
      AzureBlobStorage__ConnectionString: "${AZURE_BLOB_CONNECTION_STRING:-}"
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "5080:8080"
  mvc:
    build:
      context: ./Part3-MVC
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ApiSettings__BaseUrl: http://api:8080/
    depends_on:
      - api
    ports:
      - "8080:8080"
volumes:
  raceday-sql-data:
